<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目侧栏 · OpenCode 预览</title>
<style>
*{box-sizing:border-box} :root{color-scheme:light;--v2-text-text-base:#464741;--v2-text-text-muted:#797a72;--v2-overlay-simple-overlay-hover:#eae9e2;--v2-overlay-simple-overlay-pressed:#e6e5dd;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#393a35;background:#faf9f5}
body{margin:0;display:grid;grid-template-columns:clamp(248px,28vw,325px) minmax(0,1fr);height:100dvh}aside{display:flex;flex-direction:column;min-height:0;background:#f1f0e9;border-right:1px solid #e3e2d9;padding:12px 6px 9px}
aside{font-family:Georgia,"Hiragino Mincho ProN",serif}.commands{display:grid;gap:1px;margin:7px 0 15px}.commands button{font:inherit;display:flex;align-items:center;gap:8px;border:0;color:inherit;background:transparent;text-align:left;padding:4px 10px;border-radius:8px;cursor:pointer}.commands button:hover,.related button:hover{background:#e8e7df}.commands svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linejoin:round;stroke-linecap:round}button:focus-visible{outline:2px solid #8c8272;outline-offset:-2px}
main{min-width:0;overflow:auto}.crumb{position:sticky;top:0;display:flex;align-items:center;gap:9px;height:50px;padding:0 24px;background:#faf9f5;border-bottom:1px solid #eae9e1;font-size:12px;color:#74756b;white-space:nowrap;overflow:hidden}.crumb b{font-weight:550;color:#46483f;text-overflow:ellipsis;overflow:hidden}
article{max-width:730px;margin:clamp(50px,10vh,92px) auto;padding:0 clamp(22px,5vw,66px)}h1{font-weight:620;letter-spacing:-.04em;font-size:clamp(23px,3vw,34px);margin:0 0 35px;line-height:1.25}.bubble{margin:0 0 28px auto;width:fit-content;max-width:90%;background:#edebe1;padding:10px 15px;border-radius:15px}article p{font-size:15px;line-height:1.8}dialog{width:min(440px,90vw);border:1px solid #d8d8cf;border-radius:13px;background:#fbfaf6;padding:16px}dialog::backdrop{background:#3333}input{width:100%;padding:8px;font:inherit}.related button{display:block;width:100%;padding:7px 9px;margin:3px 0;border:0;background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit;border-radius:6px}#native{overflow:auto}.native-title{font-size:13px;color:#75776c;margin:8px}
@media(max-width:630px){body{grid-template-columns:minmax(180px,53%) minmax(0,1fr)}.crumb{padding:0 12px}article{padding:0 13px}article p{font-size:13px}.bubble{max-width:100%}}
#close-dialog h2{font-size:17px;margin:0 0 8px}#close-path{white-space:pre-line;overflow-wrap:anywhere}#close-dialog footer{display:flex;justify-content:flex-end;gap:8px}#close-dialog button{font:inherit;border:1px solid #d9d7cc;border-radius:6px;padding:3px 12px;background:#f1f0e9;cursor:pointer}.ps-demo-native-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 8px}.ps-demo-native-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ps-demo-native-row button{width:auto;font-size:12px}
/* TREE */
</style>
<aside><div class="commands">
<button id="new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4H6a3 3 0 0 0-3 3v11a3 3 0 0 0 3 3h11a3 3 0 0 0 3-3v-6M10 14l1-4 8-8 3 3-8 8z"/></svg>新会话</button>
<button id="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.7"/><path d="m16 16 5 5"/></svg>搜索</button></div><div id="native" class="related" hidden></div></aside>
<main><div class="crumb"><span id="crumb"></span><span aria-hidden="true">/</span><b id="subtitle"></b></div><article><h1></h1><p class="bubble"></p><p id="answer"></p></article></main>
<dialog id="search-dialog"><input type="search" aria-label="搜索会话" placeholder="搜索会话"><div id="results" class="related"></div></dialog>
<dialog id="close-dialog" aria-labelledby="close-heading"><form method="dialog"><h2 id="close-heading">关闭项目？</h2><p id="close-path"></p><footer><button value="cancel" autofocus>取消</button><button value="close">确认关闭</button></footer></form></dialog>
<script>/* DEMO */</script></html>
